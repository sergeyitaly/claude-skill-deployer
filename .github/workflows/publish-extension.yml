# Publish Claude Skills Manager to VS Marketplace and/or Open VSX.
# Open VSX is used by Cursor and Kiro IDE extension galleries (https://open-vsx.org).
#
# Secrets (repository settings):
#   VSCE_PAT  — Visual Studio Marketplace personal access token
#   OVSX_PAT  — Open VSX personal access token (https://open-vsx.org)
#
# First-time Open VSX: create namespace "serhiivoinolovych" and link this GitHub repo.

name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Registry target
        required: true
        default: both
        type: choice
        options:
          - dry-run
          - marketplace
          - open-vsx
          - both
  push:
    tags:
      - "v*"

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Integration smoke test
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npm run package

      - name: List VSIX artifact
        run: ls -la *.vsix

      - name: Dry run (package only)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.publish_target == 'dry-run'
        run: echo "Dry run — VSIX packaged; no registry upload."

      - name: Publish to Visual Studio Marketplace
        id: publish_marketplace
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.publish_target == 'marketplace' ||
              github.event.inputs.publish_target == 'both'))
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not set — skipping Visual Studio Marketplace publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx @vscode/vsce publish -p "$VSCE_PAT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX (Cursor + Kiro)
        id: publish_openvsx
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.publish_target == 'open-vsx' ||
              github.event.inputs.publish_target == 'both'))
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret is not set — skipping Open VSX publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VSIX=$(node -p "const p=require('./package.json'); \`\${p.name}-\${p.version}.vsix\`")
          if [ ! -f "$VSIX" ]; then
            echo "Expected $VSIX not found"
            exit 1
          fi
          npx ovsx publish "$VSIX" -p "$OVSX_PAT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Verify registry publish
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.publish_target != 'dry-run')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PUBLISH_TARGET: ${{ github.event.inputs.publish_target }}
        run: |
          want_marketplace=false
          want_openvsx=false
          if [ "${{ github.event_name }}" = "push" ]; then
            want_marketplace=true
            want_openvsx=true
          else
            case "$PUBLISH_TARGET" in
              marketplace) want_marketplace=true ;;
              open-vsx) want_openvsx=true ;;
              both) want_marketplace=true; want_openvsx=true ;;
            esac
          fi
          published=0
          if [ "$want_marketplace" = true ] && [ -n "$VSCE_PAT" ]; then
            published=1
          fi
          if [ "$want_openvsx" = true ] && [ -n "$OVSX_PAT" ]; then
            published=1
          fi
          if [ "$published" -eq 0 ]; then
            echo "::error::No registry publish ran. Add VSCE_PAT and/or OVSX_PAT in repository secrets (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Upload VSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-skills-manager-vsix
          path: extension/*.vsix
          if-no-files-found: ignore
